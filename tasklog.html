<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style><script>window.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var h=a.getAttribute("href");if(h==="#")h="";if(location.hash.slice(1)!==h.slice(1)){location.hash=h;}},true);</script><title>Task Log Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Visual layer follows the "Hyper Task Log – Updated UI" Figma: Inter, warm near-black ground,
   #232220 panels, 1.5px outlines, deep-red primary buttons, Needs you / Waiting / Done status colours. */
:root {
  --bg: #1f1e1c;
  --panel: #232220;
  --raised: #2a2926;
  --bubble: #3a3936;
  --line: #3a3936;
  --line-2: #4d4c48;
  --edge: #d9d7d2;
  --fg: #ecebe8;
  --muted: #a3a19c;
  --faint: #7a7873;
  --red: #ff1a1a;
  --redbtn: #d91414;
  --redbtn-hi: #ee2a2a;
  --need: #ff8a78;
  --wait: #f2b36b;
  --done: #8fcb8b;
  --blue: #7cc4ff;
  --focus: #54b5ff;
  /* names the scripts and older rules still use */
  --lime: var(--red);
  --lime-hi: #ff5a4f;
  --btn: var(--redbtn);
  --btn-hi: var(--redbtn-hi);
  --on-lime: #fff;
  --row-line: var(--line);
  --f: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 15px; -webkit-font-smoothing: antialiased; }
a { color: var(--fg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
input::placeholder { color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

main {
  margin: 0;
  width: 100%;
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
  padding-top: 24px; padding-bottom: 64px;
  display: flex; flex-direction: column;
}
#home { gap: 24px; }
#project { gap: 48px; }
.view-enter { animation: rise .28s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } }

/* shared */
.icon-btn {
  width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--fg);
  display: flex; align-items: center; justify-content: center; flex: none; transition: background .15s;
}
.icon-btn:hover { background: var(--raised); }
a.icon-btn { text-decoration: none; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
h2.sec { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }

/* ---------- List ---------- */
.welcome { width: 100%; position: relative; padding: 16px 52px 16px 20px; background: var(--panel); border-left: 2px solid var(--red); border-radius: 12px; font-size: 14.5px; line-height: 22px; }
.welcome p { margin: 0; } .welcome p + p { margin-top: 6px; }
.welcome b { font-weight: 600; }
.welcome a { color: var(--fg); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.welcome-x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.welcome-x:hover { background: var(--raised); color: var(--fg); }
.search-wrap { width: 100%; position: relative; }
.search {
  display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1.5px solid var(--line);
  border-radius: 12px; padding: 7px 8px 7px 18px; transition: border-color .15s;
}
.search:focus-within { border-color: var(--line-2); }
.search input { flex: 1 1 auto; min-width: 0; height: 44px; border: 0; background: transparent; font-size: 17px; outline: none; }
.search input::-webkit-search-cancel-button { filter: invert(.6); }
.filter-pill { width: auto !important; height: 44px; padding: 0 16px 0 14px; gap: 8px; border: 1.5px solid var(--line-2); border-radius: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.filter-pill:hover, .filter-pill[aria-pressed="true"] { background: var(--raised); }
.filter-pill svg { width: 16px; height: 16px; }
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 5; width: min(280px, 100%);
  background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45);
}
.pop p { margin: 8px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pop button {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left;
  padding: 10px; border: 0; background: transparent; border-radius: 8px; font-size: 14px;
}
.pop button:hover { background: var(--bubble); }
.pop button svg { opacity: 0; color: var(--red); }
.pop button[aria-checked="true"] svg { opacity: 1; }
.pop hr { border: 0; border-top: 1px solid var(--line-2); margin: 6px 0; }

.side-open .ask-main { display: none; }
.recent-h { display: none; }
.recent-h-old { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 20px; }
.recent-h .count { font-size: 13px; color: var(--faint); }
.table { background: none; border: 0; border-radius: 0; overflow: visible; }
.thead, .hrow { display: grid; grid-template-columns: minmax(0, 1fr) 128px 150px; align-items: center; gap: 16px; padding: 0 20px; }
.thead { height: 40px; background: none; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--faint); margin-bottom: 8px; }
.thead span:last-child, .hrow .time { text-align: right; }
.table ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.table li { border: 0; }
.hrow { height: 62px; border-radius: 9px; text-decoration: none; color: var(--fg); transition: background .12s; }
.hrow:hover { background: var(--raised); }
.hrow .t { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hrow .t > svg { display: none; }
.hrow .t .nm { font-size: 17px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow mark { background: rgba(255,26,26,.28); color: var(--fg); border-radius: 3px; padding: 0 1px; }
.hrow .time { font-size: 15px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; transition: color .12s; }
.hrow:hover .time { color: var(--fg); }
.no-results { padding: 40px 20px; text-align: center; color: var(--muted); }
.no-results button { margin-top: 12px; background: transparent; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 16px; font-size: 14px; }
.no-results button:hover { background: var(--raised); }

.st { display: inline-flex; align-items: center; gap: 7px; justify-self: start; font-size: 12px; font-weight: 600; line-height: 16px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.need { color: var(--need); background: rgba(255,138,120,.15); }
.st.prog { color: var(--blue); background: rgba(124,196,255,.14); }
.st.wait { color: var(--wait); background: rgba(242,179,107,.15); }
.st.done { color: var(--done); background: rgba(143,203,139,.15); }
.new-badge { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--need); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; flex: none; }
.fchips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; color: var(--fg); background: var(--panel); }
.fchip b { font-weight: 600; }
.fchip button { width: 22px; height: 22px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.fchip button:hover { background: var(--raised); color: var(--fg); }

/* ---------- Task page ---------- */
.proj-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.proj-title { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; }
.proj-h h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 40px; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.proj-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 22px; font-size: 13.5px; color: var(--muted); }
.lnk { border: 0; background: none; padding: 0; color: var(--fg); font-size: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.lnk:hover { color: #fff; }
.back-btn { margin-right: 2px; }
.ask-main {
  flex: none; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--redbtn); border: 1.5px solid var(--edge); border-radius: 8px; color: var(--fg); font-size: 14px; font-weight: 600; transition: background .15s;
}
.ask-main:hover { background: var(--redbtn-hi); }
.ask-main svg { width: 18px; height: 18px; }

.attn-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.attn-item { background: var(--panel); border-left: 3px solid var(--need); border-radius: 10px; padding: 13px 16px 10px; display: flex; flex-direction: column; gap: 17px; }
.attn-item.waiting { border-left-color: var(--wait); }
.attn-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; }
.attn-top .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--need); }
.attn-top .tag.waiting { color: var(--wait); }
.attn-top .who { font-weight: 600; color: var(--fg); flex: 1 1 auto; min-width: 0; }
.attn-top .when { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.attn-text { margin: 0; font-size: 16px; line-height: 1.5; max-width: 72ch; }
.attn-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn-lime { height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--redbtn); color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s; }
.btn-lime:hover { background: var(--redbtn-hi); }
.btn-lime.sm { height: 34px; padding: 0 14px; }
.btn-text { height: 34px; padding: 0 14px; border: 1px solid var(--muted); border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
.btn-text:hover { color: var(--fg); border-color: var(--fg); }
.btn-out { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: transparent; font-size: 14px; font-weight: 600; transition: background .15s; }
.btn-out:hover:not(:disabled) { background: var(--raised); }
.btn-out:disabled { opacity: .45; cursor: default; }

.activity, .artifacts, .sources { display: flex; flex-direction: column; gap: 14px; }
.artifacts { padding-bottom: 32px; }
.activity > h2.sec, .artifacts > h2.sec, .sources > h2.sec { padding-bottom: 5px; border-bottom: 1px solid var(--line-2); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tl li { position: relative; display: grid; grid-template-columns: 11px minmax(0, 1fr); gap: 16px; padding: 8px 0; }
.tl li:not(:last-child)::after { content: ""; position: absolute; left: 5px; top: 14px; width: 1.5px; height: calc(100% + 4px); background: var(--line-2); }
.tl .dot { position: relative; z-index: 1; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--muted); margin-top: 0; }
.tl li:first-child .dot { border-color: var(--red); background: var(--red); }
.tl-body p { margin: 0; }
.tl-body > p:first-child { font-size: 15px; line-height: 18px; overflow-wrap: anywhere; }
.tl-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px !important; font-size: 13px; line-height: 16px; color: var(--muted); }

.art-group { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 24px; padding: 8px 0; }
.art-group .date { margin: 0; flex: 0 0 40px; font-size: 12px; font-weight: 600; color: var(--muted); }
.art-grid { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px 24px; }
.card {
  position: relative; flex: 0 1 228px; max-width: 100%; min-height: 45px; display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); text-align: left; transition: background .15s, border-color .15s;
}
.card:hover { background: var(--raised); border-color: var(--line-2); }
.card svg { flex: none; }
.card .nm { display: block; min-width: 0; }
.card .nm b { display: block; font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .nm span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sources ol { list-style: none; margin: 0; padding: 0; }
.sources li { border-bottom: 1px solid var(--line); }
.src { display: flex; align-items: center; gap: 20px; padding: 16px 0; color: var(--fg); width: 100%; background: none; border: 0; text-align: left; }
button.src:hover .src-name { text-decoration: underline; text-underline-offset: 3px; }
button.src svg { transition: transform .15s; flex: none; }
button.src:hover svg { transform: translateX(3px); }
.src-name { font-size: 16px; font-weight: 500; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.src-kind { font-size: 13px; color: var(--muted); white-space: nowrap; }
.src.gone { cursor: default; }
.src.gone .src-name { color: var(--line-2); }
.gone-pill { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 8px; padding: 4px 12px; white-space: nowrap; }

.picker { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.picker-h { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.picker-list { display: grid; gap: 2px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 14.5px; }
.pick:hover { background: var(--raised); }
.pick input { accent-color: var(--redbtn); width: 16px; height: 16px; }
.pick span { flex: 1; min-width: 0; }
.pick em { font-style: normal; font-size: 12.5px; color: var(--muted); }
.upload { display: inline-flex; align-items: center; gap: 8px; justify-self: start; height: 34px; padding: 0 12px; border: 1px dashed var(--line-2); border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.upload:hover { background: var(--raised); }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.picker-actions { display: flex; gap: 6px; align-items: center; }

/* ---------- Overlays and the standalone chat drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,7,6,.6); z-index: 30; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.modal {
  position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(720px, calc(100% - 32px)); max-height: min(80vh, 760px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; animation: pop .22s ease both;
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
.modal-h { position: sticky; top: 0; display: flex; align-items: center; gap: 12px; padding: 16px 16px 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.modal-h .ttl { flex: 1; min-width: 0; }
.modal-h .ttl b { display: block; font-size: 17px; }
.modal-h .ttl span { font-size: 13px; color: var(--muted); }
.modal-b { padding: 24px; line-height: 1.65; font-size: 15px; }
.modal-b h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.modal-b p { margin: 0 0 14px; max-width: 65ch; }
.email-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.email-meta dt { color: var(--muted); } .email-meta dd { margin: 0; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f); font-size: 11px; }

.drawer {
  position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
  background: var(--side, #1b1a18); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  animation: slide .25s ease both;
}
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.drawer .modal-h { position: static; background: transparent; }
.msgs { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 88%; line-height: 1.55; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--bubble); color: var(--fg); padding: 10px 16px; border-radius: 16px; }
.msg.ai { align-self: flex-start; }
.msg.ai.thinking { color: var(--muted); }
.msg.ai.has-draft { max-width: 100%; width: 100%; }
.draft { margin-top: 10px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; white-space: normal; }
.draft dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.draft dt { color: var(--muted); } .draft dd { margin: 0; overflow-wrap: anywhere; }
.draft .body { padding: 12px 14px; white-space: pre-wrap; font-size: 14px; line-height: 1.55; }
.draft input, .draft textarea { width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font-size: 13.5px; outline: none; }
.draft textarea { min-height: 150px; resize: vertical; line-height: 1.5; font-size: 14px; }
.draft input:focus, .draft textarea:focus { border-color: var(--muted); }
.draft .edit-body { padding: 12px 14px; }
.draft-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
.draft-actions .btn-lime { height: 36px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; }
.btn-ghost { height: 36px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: transparent; font-size: 14px; font-weight: 600; }
.btn-ghost:hover { background: var(--raised); }
.draft-status { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.draft-status.sent { color: var(--fg); }
.draft-status.sent svg { color: var(--done); }
.draft.discarded { opacity: .55; }
.msg.note { align-self: center; max-width: 100%; font-size: 12.5px; color: var(--faint); padding: 0; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.chips button:hover { color: var(--fg); background: var(--raised); }
.ask { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.ask:focus-within { border-color: var(--line-2); }
.ask input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font-size: 16px; outline: none; height: 36px; }
.ask input::placeholder { color: var(--muted); }
.send-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; display: grid; place-items: center; flex: none; }
.drawer form { padding: 12px 16px 16px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 200%);
  background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 16px; font-size: 14px; z-index: 40;
  transition: transform .3s ease, visibility 0s .3s; max-width: calc(100% - 32px); visibility: hidden;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .3s ease; }

/* ---------- Narrow screens (the width of this page: phone, or the space beside the task chat) ---------- */
@media (min-width: 1000px) { .attn-list { margin-right: 32px; } }
@media (max-width: 760px) {
  main { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  #project { gap: 40px; }
  .proj-h h1 { font-size: 30px; line-height: 36px; }
}
@media (max-width: 640px) {
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; padding-bottom: 48px; }
